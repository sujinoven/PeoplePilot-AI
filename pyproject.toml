[project]
name = "proitbridge-hr-assistant"
version = "0.1.0"
description = "PROITBRIDGE HR Assistant - LangGraph + LangSmith + LangGraph Studio"
readme = "README.md"
requires-python = ">=3.11"
dependencies =[
    "colorama>=0.4.6",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.32",
    "langsmith>=0.14.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
]
[tool.uv]
package = false

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
]
